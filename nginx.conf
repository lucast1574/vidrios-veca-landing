server {
  listen 80;
  server_name www.veca.com.pe veronica.santillan.pro;
  return 301 https://veca.com.pe$request_uri;
}
server {
  listen 80 default_server;
  server_name veca.com.pe _;
  absolute_redirect off;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/xml text/xml application/ld+json;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  location = /health { access_log off; default_type text/plain; add_header X-Robots-Tag noindex always; return 200 'ok'; }
  location = /index.html { if ($request_uri ~ "^/index\.html") { return 301 https://veca.com.pe/$is_args$args; } }
  location = /robots.txt { default_type text/plain; add_header Cache-Control 'no-cache'; }
  location = /sitemap.xml { default_type application/xml; add_header Cache-Control 'no-cache'; }
  location / { try_files $uri $uri/ =404; }
  location ~* \.(?:webp|woff2|ttf|svg)$ { expires 1d; add_header Cache-Control "public"; }
  location ~* \.(?:html|css|js)$ { add_header Cache-Control "no-cache"; }
}
